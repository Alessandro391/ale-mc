<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MC Ale Officina, Ciampino</title>
<meta name="description" content="Officina a Ciampino, Viale Kennedy 103. Prezzi stimati, diagnosi dei sintomi, prezzi medi dei ricambi, prenotazione in 3 passi.">
<meta name="theme-color" content="#030406">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Anteprima su WhatsApp: crea og-image.png (1200×630) nella stessa cartella -->
<meta property="og:title" content="MC Ale Officina, Ciampino">
<meta property="og:description" content="Prezzi, diagnosi, ricambi. Prenota in 3 passi.">
<meta property="og:image" content="og-image.png">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232E5BFF'/%3E%3Cpath d='M38 18a10 10 0 0 0-12 13L15 42a4 4 0 0 0 6 6l11-11a10 10 0 0 0 13-12l-6 6-6-1-1-6z' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#030406; --ink:#F3F5F8; --ink2:#9BA3AE; --g:rgba(255,255,255,.055); --g2:rgba(255,255,255,.1); --gb:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.09); --sh:0 14px 40px rgba(0,0,0,.55); --ombra-tab:0 18px 50px rgba(0,0,0,.75);
  --blu:#2E5BFF; --blu2:#6E8DFF; --blu3:#1733C9; --blu-soft:rgba(46,91,255,.18); --glow:0 10px 32px rgba(46,91,255,.5);
  --grafite:#14171D; --verde:#22A55A; --rosso:#F04438; --arancio:#F5A524;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tab-h:76px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 19px/1.4 var(--f);min-height:100vh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--blu2);outline-offset:3px;border-radius:12px}
[hidden]{display:none!important}

/* sfondo: nero con luce blu e una griglia leggera */
.sfondo{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px}
.sfondo i{position:absolute;border-radius:50%;filter:blur(80px)}
.sfondo i:nth-child(1){width:70vmax;height:70vmax;left:-30vmax;top:-35vmax;background:radial-gradient(circle,rgba(46,91,255,.55),transparent 65%)}
.sfondo i:nth-child(2){width:55vmax;height:55vmax;right:-30vmax;top:30vh;background:radial-gradient(circle,rgba(23,51,201,.45),transparent 65%)}
.sfondo i:nth-child(3){width:50vmax;height:50vmax;left:-10vmax;bottom:-35vmax;background:radial-gradient(circle,rgba(155,163,174,.14),transparent 65%)}
@media (prefers-reduced-motion:no-preference){
  .sfondo i:nth-child(1){animation:deriva 24s ease-in-out infinite alternate}
  .sfondo i:nth-child(2){animation:deriva 28s ease-in-out infinite alternate-reverse}
}
@keyframes deriva{to{transform:translate(6vmax,4vmax) scale(1.08)}}

.vetro{background:var(--g);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--gb);box-shadow:var(--sh);border-radius:26px}
.pagina{max-width:560px;margin:0 auto;padding:0 16px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom))}

/* testata */
.testa{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.testa .riga{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;border-radius:22px;background:rgba(10,12,16,.72)}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,var(--blu),var(--blu3));display:grid;place-items:center;flex:none;box-shadow:var(--glow)}
.marchio{flex:1;min-width:0;line-height:1.15}
.marchio b{display:block;font-size:19px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marchio span{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink2)}
.punto{width:9px;height:9px;border-radius:50%;background:#5B6470;flex:none}
.punto.on{background:var(--blu2);box-shadow:0 0 0 4px var(--blu-soft),0 0 12px var(--blu)}
.chiama{display:flex;align-items:center;gap:8px;background:var(--blu-soft);border:1px solid rgba(110,141,255,.5);color:#fff;font-weight:700;font-size:17px;padding:0 16px;height:48px;border-radius:999px;text-decoration:none;flex:none}
.chiama svg{color:var(--blu2)}

/* intestazione di sezione: sempre chiaro dove sei */
.sez-testa{display:flex;align-items:center;gap:12px;margin:14px 2px 4px}
.sez-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--blu2);background:var(--grafite);border:1px solid var(--gb)}
.sez-ico.forte{background:linear-gradient(145deg,var(--blu),var(--blu3));color:#fff;border:0;box-shadow:var(--glow)}
.sez-testa h1{margin:0;font-size:36px;line-height:1.05;font-weight:800;letter-spacing:-.025em}
.sez-sotto{margin:0 2px 14px;color:var(--ink2);font-size:17px}

/* passi */
.passi{display:flex;gap:6px;margin:0 0 14px;padding:6px;border-radius:20px}
.passo{flex:1;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:15px;font-weight:700;font-size:15px;color:var(--ink2)}
.passo i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;border:2px solid currentColor;flex:none}
.passo.ora{background:var(--blu);color:#fff;box-shadow:var(--glow)}
.passo.fatto{color:var(--blu2)}
.passo.fatto i{background:var(--blu-soft);border-color:var(--blu2)}
.istruzione{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;margin:18px 4px 10px}
.istruzione svg{color:var(--blu2);flex:none}
.scelte-fatte{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;font-weight:700;font-size:16px;min-height:44px}
.chip svg{color:var(--blu2)}

/* griglie e tasti */
.griglia{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;text-align:left;padding:16px;min-height:118px;border-radius:24px}
.tile .em{font-size:30px;line-height:1}
.tile .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:var(--blu2);background:var(--grafite);border:1px solid var(--gb)}
.tile b{font-size:19px;line-height:1.15;letter-spacing:-.01em}
.tile small{display:block;color:var(--ink2);font-size:15px;font-weight:600;margin-top:2px}
.tile .pz-t{color:var(--blu2);font-weight:800;font-size:15px}
.premi{transition:transform .12s ease,border-color .2s}
.premi:active{transform:scale(.97)}
@media (hover:hover){.vetro.premi:hover{border-color:rgba(110,141,255,.45)}}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;border-radius:20px;font-weight:800;font-size:20px;letter-spacing:-.01em;text-decoration:none;text-align:center;padding:0 18px}
.btn .due-righe{display:block;line-height:1.15}
.btn .due-righe small{display:block;font-size:15px;font-weight:700;opacity:.85;margin-top:2px}
.btn.prim{background:linear-gradient(180deg,#3F6BFF,var(--blu3));color:#fff;box-shadow:var(--glow)}
.btn.rosso{background:var(--rosso);color:#fff}
.btn.vetro{color:var(--ink)}
.btn[disabled]{opacity:.6}
.pila{display:grid;gap:10px;margin-top:14px}
.link-tasto{display:inline-flex;align-items:center;gap:6px;color:var(--blu2);font-weight:700;font-size:17px;min-height:44px}

/* home */
.cta{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:20px;border-radius:28px;background:linear-gradient(135deg,#3F6BFF,var(--blu3) 70%);color:#fff;box-shadow:0 20px 50px rgba(46,91,255,.45);margin:4px 0 14px;border:1px solid rgba(255,255,255,.18)}
.cta .ci{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.cta b{display:block;font-size:26px;line-height:1.05;letter-spacing:-.02em}
.cta span{display:block;font-size:16px;font-weight:700;opacity:.85;margin-top:4px}
.cta .fr{margin-left:auto}
.blocco{padding:16px;margin-top:14px}
.blocco h2{margin:0 0 10px;font-size:22px;letter-spacing:-.015em}
.orario{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:18px}
.orario:first-of-type{border-top:0}
.orario .dx{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.orario .dx small{display:block;color:var(--ink2);font-size:15px;font-weight:600}
.orario.oggi{color:var(--blu2)}
.orario .tag{display:inline-block;background:var(--blu-soft);border-radius:8px;padding:1px 8px;font-size:14px;margin-left:6px;font-weight:700}
.promesse{display:flex;flex-wrap:wrap;gap:8px}
.promessa{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;font-weight:700;font-size:16px}
.promessa svg{color:var(--blu2)}

/* mappa (scura, stile tech) */
.mappa{overflow:hidden;padding:0;margin-top:14px}
.mappa-img{position:relative;display:block;height:210px;overflow:hidden;background:#0d1016}
.mappa-img iframe{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);border:0;pointer-events:none;filter:invert(.92) hue-rotate(190deg) saturate(.7) brightness(.85) contrast(1.1)}
.mappa-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(3,4,6,.7))}
.pin{position:absolute;left:50%;top:50%;width:0;height:0;z-index:1}
.pin::before{content:"";position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;background:rgba(46,91,255,.45)}
.pin span{position:absolute;left:-19px;top:-46px;width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--blu);border:3px solid #fff;box-shadow:0 0 22px rgba(46,91,255,.9)}
.pin span::after{content:"";position:absolute;left:10px;top:10px;width:12px;height:12px;border-radius:50%;background:#fff}
@media (prefers-reduced-motion:no-preference){.pin::before{animation:onda 1.8s ease-out infinite}}
@keyframes onda{from{transform:scale(.4);opacity:1}to{transform:scale(1.7);opacity:0}}
.mappa-off{display:grid;place-items:center;align-content:center;gap:8px;background:linear-gradient(160deg,#141922,#0b0e14)}
.mappa-off::after{display:none}
.mappa-off .btn{width:auto;min-height:52px}.mappa-off small{color:#9BA3AE;font-size:14px}
.privacy h2{font-size:21px;margin:22px 0 6px;letter-spacing:-.01em}.privacy p,.privacy li{font-size:17px;line-height:1.5;max-width:68ch}
.privacy ul{padding-left:22px;margin:6px 0}.privacy li{margin:4px 0}.privacy .agg{color:var(--ink2);font-size:14px}
footer a{color:inherit;font-weight:700}
.paga{padding:16px;margin-top:14px}.paga p{margin:4px 0 12px;color:var(--ink2);font-size:16px}
.mappa-info{display:flex;align-items:center;gap:12px;padding:14px 16px}
.mappa-info div{flex:1;min-width:0}
.mappa-info b{display:block;font-size:19px}
.mappa-info span{display:block;color:var(--ink2);font-size:15px}
.mappa-info .btn{width:auto;min-height:52px;font-size:17px;border-radius:16px;flex:none}
.osm{display:block;font-size:12px;color:var(--ink2);padding:0 16px 10px}

/* prezzo stimato */
.risultato{padding:20px;margin-top:6px;text-align:center}
.risultato .lab{font-size:15px;font-weight:700;color:var(--ink2)}
.risultato .cifra{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:6px 0;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#AFC1FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.risultato .note{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0 4px}
.etichetta{display:inline-flex;align-items:center;gap:6px;background:var(--blu-soft);color:#C9D5FF;border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px}
.piccolo{font-size:15px;color:var(--ink2)}
.riga-r.auto-tile svg{color:var(--ink)}

/* diagnosi: il semaforo resta rosso, arancio e verde perché è un segnale di sicurezza */
.semaforo{padding:20px;margin-top:6px}
.sem-testa{display:flex;align-items:center;gap:14px}
.luce{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff}
.luce.r{background:radial-gradient(circle at 35% 30%,#FF8A80,#D92D20);box-shadow:0 0 0 8px rgba(240,68,56,.16),0 0 28px rgba(240,68,56,.5)}
.luce.a{background:radial-gradient(circle at 35% 30%,#FFD27A,#DC8A00);box-shadow:0 0 0 8px rgba(245,165,36,.16),0 0 28px rgba(245,165,36,.45)}
.luce.v{background:radial-gradient(circle at 35% 30%,#86EFAC,#16A34A);box-shadow:0 0 0 8px rgba(34,165,90,.16),0 0 28px rgba(34,165,90,.45)}
.sem-testa b{display:block;font-size:28px;line-height:1.05;letter-spacing:-.02em}
.sem-testa span{color:var(--ink2);font-weight:700;font-size:16px}
.azioni-sub{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.azioni-sub li{display:flex;gap:12px;align-items:flex-start;background:var(--g2);border-radius:16px;padding:12px 14px;font-weight:600;font-size:18px}
.azioni-sub li i{width:28px;height:28px;border-radius:50%;background:var(--blu);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800;flex:none}
.cause{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cause span{background:var(--g2);border-radius:10px;padding:6px 10px;font-weight:700;font-size:15px}
.titoletto{font-size:15px;font-weight:800;color:var(--ink2);margin:18px 2px 0}
.spia-ic{width:52px;height:52px;border-radius:14px;background:#000;border:1px solid var(--gb);display:grid;place-items:center}
.swatch{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.4)}

/* ricambi */
.avviso-r{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:20px;background:var(--g);border:1px solid var(--gb);border-left:4px solid var(--blu);font-size:16px;margin-bottom:12px}
.avviso-r b{display:block;font-size:17px}
.avviso-r svg{color:var(--blu2);flex:none;margin-top:2px}
.cerca{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:58px;border-radius:18px;margin-bottom:10px}
.cerca input{flex:1;border:0;background:none;outline:none;font-size:19px;min-width:0;padding:14px 0}
.cerca svg{color:var(--ink2)}
.filtri{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.filtri::-webkit-scrollbar{display:none}
.filtro{flex:none;padding:10px 16px;border-radius:999px;font-weight:700;font-size:16px;min-height:46px}
.filtro[aria-pressed="true"]{background:var(--blu);border-color:var(--blu);color:#fff}
.righe{display:grid;gap:8px}
.riga-r{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:20px;min-height:72px}
.riga-r .em{font-size:26px;width:44px;height:44px;border-radius:13px;background:var(--grafite);display:grid;place-items:center;flex:none}
.riga-r b{display:block;font-size:18px;line-height:1.2}
.riga-r small{display:block;color:var(--ink2);font-size:14px}
.riga-r .pz{margin-left:auto;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:6px;color:#C9D5FF}

/* prenota */
.giorni{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.giorni::-webkit-scrollbar{display:none}
.gio{flex:none;scroll-snap-align:start;min-width:78px;padding:10px 6px;border-radius:20px;text-align:center}
.gio b{display:block;font-size:15px;color:var(--ink2);font-weight:700}
.gio strong{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.gio span{display:block;font-size:14px;color:var(--ink2);font-weight:600}
.gio[aria-pressed="true"],.ora[aria-pressed="true"]{background:var(--blu);border-color:var(--blu);color:#fff;box-shadow:var(--glow)}
.gio[aria-pressed="true"] b,.gio[aria-pressed="true"] span{color:#E3E9FF}
.fascia{font-size:15px;font-weight:800;color:var(--ink2);margin:12px 4px 6px}
.ore{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ora{min-height:54px;border-radius:16px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.srv-lista{display:grid;gap:8px}
.srv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:20px;min-height:66px}
.srv .em{font-size:26px;width:44px;text-align:center;flex:none}
.srv b{display:block;font-size:18px}
.srv small{display:block;color:var(--ink2);font-size:14px}
.srv .pz{margin-left:auto;font-weight:800;font-size:16px;white-space:nowrap;text-align:right;padding-left:6px;color:#C9D5FF}
.srv[aria-pressed="true"],.tile[aria-pressed="true"]{border-color:var(--blu);box-shadow:0 0 0 2px var(--blu),var(--glow);background:rgba(46,91,255,.12)}
.altri-srv{margin-top:8px}
#s-lavoro,#s-quando,#s-dati,.campo,#erroreInvio{scroll-margin-top:100px;scroll-margin-bottom:200px}
.campo{margin:0 0 12px}
.campo label{display:block;font-weight:700;font-size:16px;margin:0 4px 6px}
.campo input,.campo textarea{width:100%;border:1px solid var(--gb);background:rgba(255,255,255,.07);border-radius:18px;padding:14px 16px;font-size:20px;min-height:58px;outline:none;color:var(--ink)}
.campo input::placeholder,.campo textarea::placeholder{color:#6B7380}
.campo textarea{min-height:84px;resize:vertical}
.campo input:focus,.campo textarea:focus{border-color:var(--blu2);box-shadow:0 0 0 4px var(--blu-soft)}
.campo .msg{display:none;color:var(--rosso);font-weight:700;font-size:16px;margin:6px 4px 0}
.campo.err input,.campo.err .targa{border-color:var(--rosso);box-shadow:0 0 0 4px rgba(240,68,56,.18)}
.campo.err .msg{display:block}
.sez-err{display:none;color:var(--rosso);font-weight:700;margin:8px 4px 0}
.sez-err.on{display:block}
.due{display:grid;grid-template-columns:3fr 2fr;gap:10px}
.targa{display:flex;align-items:stretch;background:#fff;border:2px solid #fff;border-radius:12px;overflow:hidden;min-height:66px}
.targa .eu{background:#0B3D91;color:#fff;width:42px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 0 5px;font-weight:800;font-size:17px}
.targa input{border:0!important;box-shadow:none!important;background:#fff!important;color:#0D1626!important;border-radius:0!important;flex:1;min-width:0;text-align:center;text-transform:uppercase;font-size:34px!important;font-weight:800;letter-spacing:.12em;padding:6px!important}
.targa input::placeholder{color:#BAC3CD!important}
details.altro{border-radius:18px;padding:0 14px;margin-bottom:12px}
details.altro summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:56px;font-weight:700;font-size:17px;cursor:pointer}
details.altro summary svg{margin-left:auto;transition:transform .2s;color:var(--blu2)}
details.altro summary::-webkit-details-marker{display:none}
details.altro[open] summary svg{transform:rotate(90deg)}
.interruttore{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;cursor:pointer;margin-bottom:10px}
.interruttore span{flex:1;font-weight:600;font-size:17px}
.interruttore input{appearance:none;-webkit-appearance:none;width:58px;height:34px;border-radius:999px;background:rgba(155,163,174,.3);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}

.fatto{text-align:center;padding-top:10px}
.spunta{width:104px;height:104px;border-radius:50%;margin:10px auto 8px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#7C9BFF,var(--blu3));box-shadow:0 0 0 10px var(--blu-soft),0 18px 50px rgba(46,91,255,.55);color:#fff}

.fatto h1{font-size:40px;margin:0;letter-spacing:-.03em}
.riep-lista{text-align:left;padding:6px 16px;margin-top:14px}

.riep-lista div:first-child{border-top:0}
.riep-lista span{color:var(--ink2)}
.riep-lista b{text-align:right}

.ora-poi li:first-child{border-top:0}

function giorno(ds) {
  const d = new Date(ds + 'T12:00:00'); const o = new Date(); o.setHours(12, 0, 0, 0); const diff = Math.round((d - o) / 864e5);
  return { top: diff === 0 ? 'Oggi' : diff === 1 ? 'Domani' : GG[d.getDay()], num: d.getDate(), mese: MM[d.getMonth()], lungo: (diff === 0 ? 'oggi' : diff === 1 ? 'domani' : GG[d.getDay()]) + ' ' + d.getDate() + ' ' + MM[d.getMonth()] };

/* ---------------- comunicazione col backend (fetch, poi JSONP per Safari) ---------------- */
const API_OK = API.indexOf('INCOLLA') < 0;
function jsonp(params) {
  return new Promise((res, rej) => {
    const cb = 'mc' + Date.now() + Math.floor(Math.random() * 1e5), s = document.createElement('script');
    const fine = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { fine(); rej(new Error('tempo scaduto')); }, 20000);
    window[cb] = d => { fine(); res(d); };
    s.onerror = () => { fine(); rej(new Error('rete')); };
    s.src = API + '?' + new URLSearchParams(Object.assign({}, params, { callback: cb })).toString();
    document.head.appendChild(s);
  });
}
async function chiama(action, dati, post) {
  if (!API_OK) throw new Error('Backend non collegato');
  dati = dati || {};
  try {
    const r = post ? await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action }, dati)) })
      : await fetch(API + '?' + new URLSearchParams(Object.assign({ action }, dati)).toString());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) { return post ? jsonp({ action, payload: JSON.stringify(dati) }) : jsonp(Object.assign({ action }, dati)); }
}
function giorniLocali() { // anteprima degli orari se il backend non risponde
  const out = [], now = new Date(), lim = new Date(now.getTime() + 2 * 3600e3);
  for (let i = 0; out.length < 10 && i < 20; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, 12); const sl = [];
    fasceGiorno(d).forEach(x => { for (let m = x[0]; m <= x[1] - 30; m += 30) { const q = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(m / 60), m % 60); if (q >= lim) sl.push(hm2(m)); } });
    if (sl.length) out.push({ data: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'), rem: 99, slots: sl });
  }
  return out;
}

async function conferma() {
  const z = S.pr; if (z.invio) return;
  const d = leggiCampi(); const e = {};
  if (!z.srv) e.servizio = 'Scegli il lavoro';
  else if (!z.data || !z.ora) e.quando = 'Scegli giorno e ora';

  if (d.cliente.length < 2) e.cliente = 'Scrivi il tuo nome';
  const tel = d.telefono.replace(/\D/g, ''); if (tel.length < 9 || tel.length > 13) e.telefono = 'Controlla il numero';
  salvaBozza();

    z.errori = e; ridisegnaFermo();
    const primo = e.servizio ? 's-lavoro' : e.quando ? 's-quando' : e.targa ? 'c-targa' : e.cliente ? 'c-cliente' : 'c-telefono';

  }

  const b = $('btnConferma'); b.disabled = true; b.textContent = 'Invio…';

    if (r && r.ok) { S.esito = r; z.richiestaId = null; z.nota = ''; vibra(); vai('fatto', true); caricaConfig(); return; }
    if (r && r.campi) { if (r.giorni) { CFG.giorni = r.giorni; primoLibero(); } z.errori = r.campi; ridisegnaFermo(); return; }
    throw new Error((r && r.errore) || 'errore');
  } catch (err) {
    const box = $('erroreInvio');
    if (box) { box.innerHTML = '<div class="errore-box">Prenotazione non inviata. Riprova o chiamaci: non verrà registrata due volte.<div class="pila"><a class="btn prim" href="tel:' + esc(CFG.telefono) + '">' + ico(P.tel, 22, 2.4) + 'Chiama</a></div></div>'; box.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  } finally { z.invio = false; const bb = $('btnConferma'); if (bb) { bb.disabled = false; bb.textContent = 'Conferma'; } }
}

}

function calendario() {

  vai: d => { if (S.vista === 'prenota') salvaBozza(); vibra(); vai(d.v); },
  mappa: () => { const m = $('mappa'); if (m) m.scrollIntoView({ behavior: 'smooth', block: 'center' }); },
  mostraMappa: () => { S.mappaOk = true; const y = window.scrollY; disegna(); window.scrollTo(0, y); },
  pzSrv: d => { S.pz.srv = d.v; S.pz.taglia = null; vibra(); disegna(); window.scrollTo({ top: 0 }); },
  pzTaglia: d => { S.pz.taglia = d.v || null; vibra(); disegna(); window.scrollTo({ top: 0 }); },
  pzReset: () => { S.pz = { srv: null, taglia: null }; disegna(); window.scrollTo({ top: 0 }); },
  dgSint: d => { S.dg = { sint: d.v, esito: null }; vibra(); disegna(); window.scrollTo({ top: 0 }); },
  dgEsito: d => { S.dg.esito = d.v || null; vibra(); disegna(); window.scrollTo({ top: 0 }); },
  dgReset: () => { S.dg = { sint: null, esito: null }; disegna(); window.scrollTo({ top: 0 }); },
  rcCat: d => { S.rc.cat = d.v; disegna(); },
  rcApri: d => {
    const r = CFG.ricambi.find(x => x.nome === d.v); if (!r) return; const srv = srvDi(CAT_SRV[r.cat]) ? CAT_SRV[r.cat] : 'ALT';
    apriFoglio('<div style="display:flex;align-items:center;gap:12px"><span style="font-size:34px">' + esc(r.icona || '🔧') + '</span><div><b style="font-size:24px;display:block;line-height:1.1">' + esc(r.nome) + '</b><span class="piccolo">' + esc(r.nota || r.cat) + '</span></div></div>' +
      '<div class="risultato vetro" style="margin-top:14px"><div class="lab">Prezzo medio del pezzo</div><div class="cifra">' + euro(r.min) + ' – ' + euro(r.max) + '</div><span class="etichetta">Montaggio escluso</span></div>' +
      '<p class="piccolo">Indicativo: può non essere affidabile. Il prezzo vero dipende da marca e modello.</p>' +
      '<div class="pila"><button class="btn prim premi" data-a="prenotaDa" data-v="' + srv + '" data-n="Ricambio: ' + esc(r.nome) + '">' + ico(P.cal, 22, 2.4) + 'Prenota il montaggio</button><button class="btn vetro premi" data-a="chiudiFoglio">Chiudi</button></div>');
  },
  chiudiFoglio: () => chiudiFoglio(),
  prenotaDa: d => {
    S.pr.srv = d.v; if (d.n) S.pr.nota = d.n; S.pr.errori = {}; primoLibero(); vibra(); vai('prenota');
    setTimeout(() => { const el = $(S.pr.data ? 's-dati' : 's-quando'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80);
  },
  prSrv: d => { salvaBozza(); S.pr.srv = d.v; delete S.pr.errori.servizio; primoLibero(); vibra(); ridisegnaFermo(); setTimeout(() => { const q = $('s-quando'); if (q) q.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60); },
  prGiorno: d => { salvaBozza(); S.pr.data = d.v; const g = CFG.giorni.find(x => x.data === d.v); if (g && g.slots.indexOf(S.pr.ora) < 0) S.pr.ora = g.slots[0]; delete S.pr.errori.quando; vibra(); ridisegnaFermo(); },
  prOra: d => { salvaBozza(); S.pr.ora = d.v; delete S.pr.errori.quando; vibra(); ridisegnaFermo(); },
  conferma: () => conferma(),
  calendario: () => calendario()
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const f = AZ[b.dataset.a]; if (f) { e.preventDefault(); f(b.dataset, b); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') chiudiFoglio(); });

/* ---------------- avvio ---------------- */
function aggiornaTesta() {
  $('nome').textContent = CFG.nome; document.title = CFG.nome + ', Ciampino';
  $('btnChiama').href = 'tel:' + String(CFG.telefono).replace(/\s/g, '');
  const st = statoOra(); $('statoOggi').textContent = st.t; $('punto').classList.toggle('on', st.on);
}
async function caricaConfig() {
  try {
    const r = await chiama('config');
    if (r && r.ok) {
      ['nome', 'telefono', 'indirizzo', 'indicazioni', 'lat', 'lon', 'orari', 'coeff'].forEach(k => { if (r[k] !== undefined && r[k] !== '') CFG[k] = r[k]; });
      ['nota_prezzi', 'ricambi_aggiornati', 'link_recensioni', 'titolare', 'pagamenti', 'conservazione_anni'].forEach(k => { if (r[k] !== undefined) CFG[k] = r[k]; });
      if (r.listino && r.listino.length) CFG.listino = r.listino;
      if (r.ricambi && r.ricambi.length) CFG.ricambi = r.ricambi;
      CFG.giorni = r.giorni || []; CFG.online = true;
    }
  } catch (e) { }
  if (!CFG.online) CFG.giorni = giorniLocali();
  aggiornaTesta();
  if (S.pr.srv) primoLibero();
  if (S.vista === 'prenota') { salvaBozza(); ridisegnaFermo(); } else if (S.vista !== 'fatto') disegna();
}
(function avvio() {
  CFG.giorni = giorniLocali(); aggiornaTesta();
  const q = new URLSearchParams(location.search);
  if (q.get('tg')) S.bozza.targa = normTarga(q.get('tg'));
  if (q.get('s') && srvDi(q.get('s'))) { S.pr.srv = q.get('s'); primoLibero(); S.vista = 'prenota'; history.replaceState(null, '', location.pathname + '#prenota'); }
  else S.vista = (location.hash || '#home').slice(1);
  if (S.vista === 'fatto') S.vista = 'home';
  disegna();
  caricaConfig();
  setInterval(aggiornaTesta, 60000);
})();
</script>
</body>
</html>
